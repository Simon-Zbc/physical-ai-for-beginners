[project]
name = "physical-ai-for-beginners"
version = "0.1.0"
description = "フィジカルAI入門連載のサンプルコード集"
requires-python = ">=3.10"
dependencies = [
    "mujoco>=3.0.0",
    "numpy>=1.26",
    "openai>=1.0",
    "pillow>=10.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# 第9章（強化学習）: uv sync --extra rl
# PyTorch は CPU 版で十分。uv では下の [tool.uv.sources] で CPU 版を取得する
# （pip の場合は chapters/ch09_reinforcement_learning/README.md を参照）
rl = [
    "stable-baselines3>=2.9",
    "gymnasium>=1.4",
    "torch>=2.9",
]

# 第10章（模倣学習）: uv sync --extra il
# PyTorch は rl と同じく CPU 版（下の [tool.uv.sources]）。numpy・pillow は本体の依存関係に含まれる
il = [
    "torch>=2.9",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
